# Used by `lab` (ANSIBLE_CONFIG). roles_path and collections_path are set by `lab`
# per environment: <env>/roles, the env `libraries`, then ansible/roles.
[defaults]
host_key_checking  = False
interpreter_python = auto_silent
forks              = 20
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = ansible.posix.profile_tasks

[callback_profile_tasks]
task_output_limit = 10

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o LogLevel=ERROR
