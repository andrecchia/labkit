---
- name: Read installed helm version
  ansible.builtin.command: "{{ helm_bin }} version --template {{ '{{' }}.Version{{ '}}' }}"
  register: _helm_current
  changed_when: false
  failed_when: false

- name: Install helm v{{ helm_version }}
  when: _helm_current.stdout | default('') != 'v' ~ helm_version
  vars:
    _arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
  block:
    - name: Download helm
      ansible.builtin.unarchive:
        src: "https://get.helm.sh/helm-v{{ helm_version }}-linux-{{ _arch }}.tar.gz"
        dest: /tmp
        remote_src: true

    - name: Install helm binary
      ansible.builtin.copy:
        src: "/tmp/linux-{{ _arch }}/helm"
        dest: "{{ helm_bin }}"
        remote_src: true
        mode: "0755"
