---
- name: Find the home of {{ ansible_user }}
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_user }}"

- name: Create ~/.kube for {{ ansible_user }}
  ansible.builtin.file:
    path: "{{ getent_passwd[ansible_user][4] }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0700"

- name: Admin kubeconfig for {{ ansible_user }}
  ansible.builtin.copy:
    src: "{{ kubernetes_admin_kubeconfig }}"
    dest: "{{ getent_passwd[ansible_user][4] }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    mode: "0600"

- name: kubectl completion and alias
  ansible.builtin.blockinfile:
    path: "{{ getent_passwd[ansible_user][4] }}/.bashrc"
    marker: "# {mark} labkit kubectl"
    block: |
      source <(kubectl completion bash)
      alias k=kubectl
      complete -o default -F __start_kubectl k

- name: Fetch the kubeconfig to this machine
  ansible.builtin.fetch:
    src: "{{ kubernetes_admin_kubeconfig }}"
    dest: "{{ lab_kubeconfig }}"
    flat: true
  run_once: true
  when: lab_kubeconfig is defined

- name: Restrict the local kubeconfig permissions
  ansible.builtin.file:
    path: "{{ lab_kubeconfig }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  run_once: true
  when: lab_kubeconfig is defined
