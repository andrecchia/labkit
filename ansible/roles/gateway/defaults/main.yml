---
gateway_provider: envoy-gateway
gateway_version: ""
gateway_namespace: "{{ gateway_catalog[gateway_provider].namespace }}"
gateway_class: "{{ gateway_catalog[gateway_provider].class }}"
gateway_api_version: "v1.6.3"
gateway_api_channel: standard
gateway_create: true
gateway_name: lab
gateway_listeners:
  - name: http
    protocol: HTTP
    port: "{{ gateway_catalog[gateway_provider].http_port }}"
    allowedRoutes:
      namespaces:
        from: All
gateway_values: {}

# Provider table: add an entry (and its name to `choices` in argument_specs) to support a new controller.
#   bundles_crds: the chart ships the Gateway API CRDs itself
#   controller:   set when labkit must create the GatewayClass (the chart does not)
#   http_port:    listener port; traefik maps its `web` entrypoint (8000) to service port 80
gateway_catalog:
  envoy-gateway:
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: "v1.9.2"
    release: envoy-gateway
    namespace: envoy-gateway-system
    class: envoy
    controller: gateway.envoyproxy.io/gatewayclass-controller
    bundles_crds: true
    http_port: 80
    values: {}
  nginx-gateway-fabric:
    chart: oci://ghcr.io/nginx/charts/nginx-gateway-fabric
    version: "2.8.0"
    release: nginx-gateway
    namespace: nginx-gateway
    class: nginx
    bundles_crds: false
    http_port: 80
    values:
      nginxGateway:
        gatewayClassName: "{{ gateway_class }}"
  traefik:
    repo: https://traefik.github.io/charts
    chart: traefik
    version: "41.7.1"
    release: traefik-gateway
    namespace: traefik-gateway
    class: traefik
    bundles_crds: false
    http_port: 8000
    values:
      providers:
        kubernetesGateway:
          enabled: true
        kubernetesIngress:
          enabled: false
      ingressClass:
        enabled: false
      gateway:
        enabled: false
      gatewayClass:
        enabled: true
        name: "{{ gateway_class }}"
