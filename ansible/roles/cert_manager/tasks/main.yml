---
- name: Check the issuers
  ansible.builtin.assert:
    that:
      - item.name is defined
      - item.type in ['selfsigned', 'ca', 'acme']
      - item.type != 'acme' or item.email is defined
    fail_msg: "issuer {{ item }}: needs name, type (selfsigned|ca|acme) and, for acme, email"
    quiet: true
  loop: "{{ cert_manager_issuers }}"

- name: Install cert-manager
  kubernetes.core.helm:
    binary_path: "{{ helm_bin }}"
    name: cert-manager
    chart_repo_url: https://charts.jetstack.io
    chart_ref: cert-manager
    chart_version: "{{ cert_manager_version }}"
    release_namespace: "{{ cert_manager_namespace }}"
    create_namespace: true
    values: "{{ _cert_manager_values | combine(cert_manager_values, recursive=True) }}"
    wait: true
    wait_timeout: 10m

- name: ClusterIssuers
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ lookup('ansible.builtin.template', 'issuers.yaml.j2') }}"
  register: _cm_apply
  changed_when: _cm_apply.stdout is search('created|configured')
  retries: 12 # the webhook needs a few seconds after the rollout
  delay: 5
  until: _cm_apply.rc == 0
  when: cert_manager_issuers | length > 0
